name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-horizon-mod for the pinned SDK build
        run: |
          SDK="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["metadata"]["horizon"]["sdk"])')"
          cargo install --locked --git https://github.com/horizon-rust/horizon --rev "$SDK" cargo-horizon-mod

      - name: Fetch pinned SDK
        run: cargo horizon-mod check

      - name: Format, clippy and unit tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build and verify the wasm .hmod
        run: |
          cargo horizon-mod build --wasm
          cargo horizon-mod check target/horizon-mod/replay_studio.hmod

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: replay_studio-hmod
          path: target/horizon-mod/replay_studio.hmod
